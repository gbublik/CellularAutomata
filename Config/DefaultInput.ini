[/Script/Engine.PlayerInput]
; Движок вешает на F1-F5 переключение режимов отрисовки (Engine/Config/
; BaseInput.ini, DebugExecBindings). Все пять клавиш заняты проектом: F1-F4 -
; профили рендера (ApplyRenderPreset), F5 - информационная панель HUD. Заметнее
; всего был F5: shadercomplexity красит весь экран, и панель пряталась под
; разноцветной картинкой. У F1-F4 конфликт тише - viewmode задают и профиль, и
; движок, так что итог зависел от того, кто отработает последним.
;
; Строки должны совпадать с BaseInput.ini ДОСЛОВНО, включая пробел после
; запятой у F1: удаление из массива в ini сверяет текст, а не разобранную
; структуру, и от лишнего пробела молча перестаёт работать.
-DebugExecBindings=(Key=F1,Command="viewmode wireframe", bIgnoreShift=True)
-DebugExecBindings=(Key=F2,Command="viewmode unlit")
-DebugExecBindings=(Key=F3,Command="viewmode lit")
-DebugExecBindings=(Key=F4,Command="viewmode lit_detaillighting")
-DebugExecBindings=(Key=F5,Command="viewmode shadercomplexity")

