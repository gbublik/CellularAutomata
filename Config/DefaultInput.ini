; --- Хоткеи проекта (префикс CA_) ---
; Отсюда AGamePlayerController берёт клавиши для ОБЕИХ половин ввода: и для
; таблицы Enhanced Input, и для сырого InputKey() (пробел, R, N, Y, цифры,
; нумпад - см. HotkeyRegistry.h, почему половин две). Значения по умолчанию
; продублированы в коде (HotkeyRegistry::GetDefaults()) и применяются, если
; строки здесь нет - удалить весь блок безопасно, управление не пропадёт.
;
; Правится и руками, и в редакторе: Project Settings -> Input -> Bindings.
; Легаси-диспетчеризация НЕ используется - ActionMappings взяты только как
; источник данных, привязка обработчиков своя.
;
; W/A/S/D/Q/E сюда не входят намеренно: это движение пешки, а не хоткеи -
; см. RebindPawnVerticalMovement() и FlyKeys в InputKey().
